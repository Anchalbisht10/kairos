<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7EFF"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0D0620"/>

  <!-- Lotus/spark symbol — 3 petals forming upward rise -->
  <!-- Center glow -->
  <circle cx="16" cy="17" r="2.5" fill="url(#g2)" opacity="0.9"/>

  <!-- Left petal -->
  <path d="M16 17 C12 14 10 10 13 7 C14 6 15 6.5 16 8 C16 8 14 11 16 17Z"
    fill="url(#g)" opacity="0.85"/>

  <!-- Right petal -->
  <path d="M16 17 C20 14 22 10 19 7 C18 6 17 6.5 16 8 C16 8 18 11 16 17Z"
    fill="url(#g2)" opacity="0.85"/>

  <!-- Center petal — going up -->
  <path d="M16 17 C14 13 14.5 9 16 6 C17.5 9 18 13 16 17Z"
    fill="white" opacity="0.6"/>

  <!-- Bottom base — grounding line -->
  <path d="M11 22 Q16 19 21 22" stroke="url(#g)" stroke-width="1.5"
    stroke-linecap="round" fill="none"/>

  <!-- Sparkle dots -->
  <circle cx="10" cy="12" r="1" fill="#E879F9" opacity="0.7"/>
  <circle cx="22" cy="12" r="1" fill="#9B7EFF" opacity="0.7"/>
  <circle cx="16" cy="24" r="0.8" fill="#C4B5FD" opacity="0.5"/>
</svg>